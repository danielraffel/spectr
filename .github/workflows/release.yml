name: Spectr Release

# A release is dispatched only after exact-head Windows ARM64EC and x64 ZIPs
# are available as authenticated assets on a pre-created draft vX.Y.Z release
# targeted at the same commit. The transient Tart guest downloads and verifies
# them before doing any macOS work, then the publisher fills and publishes
# that draft atomically.
on:
  workflow_dispatch:
    inputs:
      release_notes_file:
        description: Path to the checked-in Markdown release notes
        required: true
        default: release-notes.md
        type: string
      windows_arm64ec_url:
        description: GitHub API URL for an asset on the pre-created draft release
        required: true
        type: string
      windows_arm64ec_sha256:
        description: SHA-256 for the exact-head ARM64EC ZIP
        required: true
        type: string
      windows_x64_url:
        description: GitHub API URL for an asset on the pre-created draft release
        required: true
        type: string
      windows_x64_sha256:
        description: SHA-256 for the exact-head x64 ZIP
        required: true
        type: string

concurrency:
  group: spectr-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Spectr release
    runs-on: [self-hosted, macOS, ARM64, spectr-build, spectr-build-vm]
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PULP_ROOT_REF: v0.980.0
      RELEASE_NOTES_FILE: ${{ inputs.release_notes_file || 'release-notes.md' }}
      WINDOWS_ARM64EC_URL: ${{ inputs.windows_arm64ec_url }}
      WINDOWS_ARM64EC_SHA256: ${{ inputs.windows_arm64ec_sha256 }}
      WINDOWS_X64_URL: ${{ inputs.windows_x64_url }}
      WINDOWS_X64_SHA256: ${{ inputs.windows_x64_sha256 }}
      # Identity hashes are public selectors, not private credentials. The
      # signing keychain and notarization profile stay on the trusted runner.
      APP_ID: ${{ vars.SPECTR_DEVELOPER_ID_APPLICATION_HASH }}
      INST_ID: ${{ vars.SPECTR_DEVELOPER_ID_INSTALLER_HASH }}
    steps:
      - name: Check out exact Spectr head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Check out the pinned Pulp installer recipe
        uses: actions/checkout@v4
        with:
          repository: Generous-Corp/pulp
          ref: ${{ env.PULP_ROOT_REF }}
          path: pulp
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Read the release version and notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('CMakeLists.txt').read_text(encoding='utf-8')
          match = re.search(r'project\s*\(\s*Spectr\s+VERSION\s+(\d+\.\d+\.\d+)', text)
          if not match:
              raise SystemExit('CMakeLists.txt has no Spectr product version')
          print(match.group(1))
          PY
          )
          [[ "$GITHUB_REF_NAME" == "release/v$version" ]] || {
            echo "release dispatch must target release/v$version (got $GITHUB_REF_NAME)" >&2
            exit 1
          }
          [[ -s "$RELEASE_NOTES_FILE" ]]
          draft=$(gh release view "v$version" --repo danielraffel/spectr --json isDraft --jq '.isDraft')
          [[ "$draft" == true ]] || { echo "v$version must already be a draft" >&2; exit 1; }
          tag_sha=$(gh api "repos/danielraffel/spectr/git/ref/tags/v$version" --jq '.object.sha')
          [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo "draft tag target differs from GITHUB_SHA" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/spectr-windows-assets"
          arm="$RUNNER_TEMP/spectr-windows-assets/Spectr-windows-arm64ec-$version.zip"
          x64="$RUNNER_TEMP/spectr-windows-assets/Spectr-windows-x64-$version.zip"
          [[ "$WINDOWS_ARM64EC_URL" == https://api.github.com/repos/*/releases/assets/* && "$WINDOWS_X64_URL" == https://api.github.com/repos/*/releases/assets/* ]] || {
            echo "Windows asset URLs must be GitHub release asset API URLs" >&2; exit 1;
          }
          [[ "$WINDOWS_ARM64EC_URL" != *\?* && "$WINDOWS_X64_URL" != *\?* ]] || {
            echo "Windows asset URLs must not contain query credentials" >&2; exit 1;
          }
          [[ "$WINDOWS_ARM64EC_SHA256" =~ ^[[:xdigit:]]{64}$ && "$WINDOWS_X64_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo "Windows asset digests must be 64 hexadecimal characters" >&2; exit 1;
          }
          draft_assets=$(gh release view "v$version" --repo danielraffel/spectr --json assets)
          DRAFT_ASSETS="$draft_assets" RELEASE_VERSION="$version" python3 - <<'PY'
          import json, os, sys
          assets = json.loads(os.environ['DRAFT_ASSETS'])['assets']
          expected = {
              f"Spectr-windows-arm64ec-{os.environ['RELEASE_VERSION']}.zip": (
                  os.environ['WINDOWS_ARM64EC_URL'], os.environ['WINDOWS_ARM64EC_SHA256']),
              f"Spectr-windows-x64-{os.environ['RELEASE_VERSION']}.zip": (
                  os.environ['WINDOWS_X64_URL'], os.environ['WINDOWS_X64_SHA256']),
          }
          if len(assets) != 2 or {a.get('name') for a in assets} != set(expected):
              sys.exit('draft must contain exactly the two named Windows assets')
          for asset in assets:
              url, digest = expected[asset['name']]
              if asset.get('apiUrl') != url or asset.get('digest') != 'sha256:' + digest.lower():
                  sys.exit(f"draft asset identity or digest differs: {asset['name']}")
          PY
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' --output "$arm" "$WINDOWS_ARM64EC_URL"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' --output "$x64" "$WINDOWS_X64_URL"
          printf '%s  %s\n' "$WINDOWS_ARM64EC_SHA256" "$arm" | shasum -a 256 --check
          printf '%s  %s\n' "$WINDOWS_X64_SHA256" "$x64" | shasum -a 256 --check
          python3 tools/ship/check_windows_release.py \
            --version "$version" --source-sha "$GITHUB_SHA" \
            --arm64ec "$arm" --x64 "$x64"
          {
            echo "arm=$arm"
            echo "x64=$x64"
            echo "version=$version"
            echo "notes=$RELEASE_NOTES_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify the exact released Pulp SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          pin=tools/ci/pulp-sdk-release.json
          asset=$(python3 -c 'import json; print(json.load(open("'$pin'"))["asset"])')
          digest=$(python3 -c 'import json; print(json.load(open("'$pin'"))["asset_sha256"])')
          sdk_sha=$(python3 -c 'import json; print(json.load(open("'$pin'"))["source_git_sha"])')
          sdk_tag=$(python3 -c 'import json; print(json.load(open("'$pin'"))["release_tag"])')
          sdk_root="$RUNNER_TEMP/spectr-sdk-$sdk_sha"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/Generous-Corp/pulp/releases/download/$sdk_tag/$asset"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 --check
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          marker=$(find "$sdk_root" -name sdk-provenance.json -type f -print -quit)
          [[ -n "$marker" ]]
          sdk_root=$(dirname "$marker")
          {
            echo "root=$sdk_root"
            echo "sha=$sdk_sha"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Configure the exact Release build
        shell: bash
        env:
          PULP_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          PULP_SDK_SHA: ${{ steps.sdk.outputs.sha }}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPulp_DIR="$PULP_SDK_ROOT/lib/cmake/Pulp" \
            -DSPECTR_EXPECTED_PULP_SDK_SHA="$PULP_SDK_SHA" \
            -DSPECTR_EXPECTED_PRODUCT_GIT_SHA="$GITHUB_SHA"
          python3 tools/ci/validate_release_sdk.py \
            --sdk-root "$PULP_SDK_ROOT" --build-dir build \
            --pin tools/ci/pulp-sdk-release.json --product-sha "$GITHUB_SHA"

      - name: Build the signed package inputs through the governed builder
        env:
          PULP_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          pulp/tools/ci/governed-build.sh cmake --build build --parallel 4 \
            --target Spectr_Standalone Spectr_AU Spectr_VST3 Spectr_CLAP

      - name: Sign, notarize and verify the installer
        env:
          PULP_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          PULP_SDK_SHA: ${{ steps.sdk.outputs.sha }}
          SPECTR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -f "$HOME/.config/pulp/secrets/sparkle/spectr_ed25519" ]]
          PULP_ROOT="$GITHUB_WORKSPACE/pulp" \
          PULP_DIR_EXPECTED="$PULP_SDK_ROOT/lib/cmake/Pulp" \
          PULP_SDK_SHA_EXPECTED="$PULP_SDK_SHA" \
          SPECTR_SHA_EXPECTED="$SPECTR_SHA" \
          APP_ID="$APP_ID" INST_ID="$INST_ID" \
          ./package.sh
          pkg="artifacts/Spectr-${{ steps.version.outputs.version }}.pkg"
          [[ -f "$pkg" ]]
          shasum -a 256 "$pkg" | tee artifacts/package.sha256

      - name: Generate and verify the signed Sparkle feed
        env:
          PULP_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          pkg="artifacts/Spectr-${{ steps.version.outputs.version }}.pkg"
          python3 tools/ship/make_appcast.py \
            --pkg "$pkg" --version "${{ steps.version.outputs.version }}" \
            --notes "${{ steps.version.outputs.notes }}" --app build/Spectr.app \
            --out artifacts/appcast.xml
          python3 tools/ship/check_sparkle.py appcast \
            --appcast artifacts/appcast.xml --pkg "$pkg" \
            --expect-version "${{ steps.version.outputs.version }}" \
            --channel release --require-notes

      - name: Publish draft, upload assets, then verify the live latest feed
        run: |
          set -euo pipefail
          PATH=/opt/homebrew/bin:$PATH python3 tools/ship/publish_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --pkg "artifacts/Spectr-${{ steps.version.outputs.version }}.pkg" \
            --appcast artifacts/appcast.xml \
            --notes "${{ steps.version.outputs.notes }}" \
            --windows-arm64ec "${{ steps.version.outputs.arm }}" \
            --windows-x64 "${{ steps.version.outputs.x64 }}" \
            --reuse-draft
