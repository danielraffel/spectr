name: Spectr M5 Product Acceptance

on:
  workflow_dispatch:
  # This gate is the only automated check in the repo, so it has to run on a PR
  # rather than only on demand. It is also a 120-minute job on a SHARED
  # self-hosted Mac, so the trigger is narrowed twice: pure docs/planning edits
  # are skipped outright, and a rapid push series on one PR collapses to a
  # single run instead of stacking builds on the runner. Anything that can
  # reach the product -- src, include, test, native-ui, resources, tools, the
  # SDK pin, CMakeLists.txt, this workflow -- still runs, deliberately: a gate
  # that opts out by default is not a gate.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'planning/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: spectr-m5-product-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  product-acceptance:
    name: Spectr M5 product-acceptance gate
    runs-on: [self-hosted, macOS, ARM64, spectr-build, spectr-build-vm, spectr-gate-fast]
    timeout-minutes: 120
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_NODEPEND: "1"
    steps:
      - name: Check out exact admitted Spectr head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 1

      - name: Gate - Spectr M5 product acceptance static contract
        run: python3 tools/ci/test_product_acceptance_contract.py

      # BLOCKING, and deliberately before the build: seconds, fixtures only, no
      # SDK and no compiler. Until this landed the job ran exactly ONE of a
      # dozen detectors, which is how two of them shipped dead -- crashing on
      # import, never adjudicating anything -- without a single red run. This
      # asserts each detector both PASSES a known-good fixture and FAILS a
      # known-bad one (or its own --plant). A detector that can only pass is
      # not coverage.
      - name: Gate - detector suite self-test (blocking)
        run: python3 tools/ci/detector_selftest.py

      - name: Gate - a drag pointer sample enqueues no React commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/spectr-detectors/drag_hover_no_react_commit.py
          # Negative control. This detector reads a CHECKED-IN artifact, so a
          # rename or restructure there would make it pass vacuously forever.
          # Stripping the drag guard must redden it.
          if python3 tools/spectr-detectors/drag_hover_no_react_commit.py \
               --plant unguard > /dev/null 2>&1; then
            echo "the planted regression did not redden the detector -- it can "\
                 "no longer fail, so its clean run above proves nothing" >&2
            exit 1
          fi

      - name: Gate - the preset manager's advertised commit gestures are wired
        shell: bash
        run: |
          set -euo pipefail
          # The manager footer advertises DOUBLE-CLICK and Return. Both were
          # dead on the shipping build -- the row's `onDoubleClick` registers
          # under the bridge event name `doubleclick`, which nothing in the
          # runtime dispatches, and the keydown handler had no Enter branch.
          # No screenshot or layout assertion can see that: the footer renders
          # identically whether its handlers fire or not.
          python3 tools/spectr-detectors/preset_commit_gestures.py
          # Negative control. This reads a CHECKED-IN artifact, so a rename or
          # restructure there would make it pass vacuously forever.
          if python3 tools/spectr-detectors/preset_commit_gestures.py \
               --plant dead-prop > /dev/null 2>&1; then
            echo "the planted regression did not redden the detector -- it can "\
                 "no longer fail, so its clean run above proves nothing" >&2
            exit 1
          fi

      - name: Gate - Spectr M5 product acceptance immutable released SDK
        shell: bash
        run: |
          set -euo pipefail
          pin="$GITHUB_WORKSPACE/tools/ci/pulp-sdk-release.json"
          sdk_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_tag"])' "$pin")"
          sdk_asset="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset"])' "$pin")"
          sdk_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset_sha256"])' "$pin")"
          sdk_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_git_sha"])' "$pin")"
          acceptance_root="$RUNNER_TEMP/spectr-product-acceptance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sdk_unpack="$acceptance_root/sdk-unpack"
          build_dir="$acceptance_root/build"
          mkdir -p "$sdk_unpack" "$build_dir"
          archive="$acceptance_root/$sdk_asset"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/Generous-Corp/pulp/releases/download/$sdk_tag/$sdk_asset"
          printf '%s  %s\n' "$sdk_digest" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$sdk_unpack"
          marker_count="$(find "$sdk_unpack" -maxdepth 3 -name sdk-provenance.json -type f | wc -l | tr -d ' ')"
          [[ "$marker_count" == "1" ]] || {
            echo "expected one extracted SDK provenance marker, found $marker_count" >&2
            exit 1
          }
          sdk_marker="$(find "$sdk_unpack" -maxdepth 3 -name sdk-provenance.json -type f -print -quit)"
          sdk_root="$(dirname "$sdk_marker")"
          {
            echo "SPECTR_ACCEPTANCE_ROOT=$acceptance_root"
            echo "SPECTR_BUILD_DIR=$build_dir"
            echo "PULP_SDK_ROOT=$sdk_root"
            echo "PULP_SDK_SHA=$sdk_sha"
          } >> "$GITHUB_ENV"

      - name: Gate - Spectr M5 product acceptance Release configure and provenance
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$GITHUB_WORKSPACE" -B "$SPECTR_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPulp_DIR="$PULP_SDK_ROOT/lib/cmake/Pulp" \
            -DSPECTR_EXPECTED_PULP_SDK_SHA="$PULP_SDK_SHA" \
            -DSPECTR_EXPECTED_PRODUCT_GIT_SHA="$GITHUB_SHA"
          python3 tools/ci/validate_release_sdk.py \
            --sdk-root "$PULP_SDK_ROOT" --build-dir "$SPECTR_BUILD_DIR" \
            --pin tools/ci/pulp-sdk-release.json --product-sha "$GITHUB_SHA"

      # A `ctest -R '(a|b|c)'` alternation hides a dead alternative: if `b`
      # matches nothing, ctest runs `a` and `c` and exits 0, and the tests
      # behind `b` simply never run. Three patterns in the previous inline
      # alternation were dead that way -- 12 registered `#34` host-parameter
      # tests had never run in this gate. The pattern list now lives in a file,
      # every entry must match at least one registered test, and the SAME file
      # produces the regex ctest is handed, so assertion and execution cannot
      # drift.
      - name: Gate - Spectr M5 product acceptance focused native artifacts
        shell: bash
        run: |
          set -euo pipefail
          # BOUNDED ON PURPOSE. This job runs on a SHARED self-hosted Mac that
          # also carries Pulp's required `macos` gate, so a bare `--parallel`
          # (unbounded `make -j`) claims every core it can see and starves the
          # gate it is sharing the box with. The bound that matters on a shared
          # host is a SHARE, and a share cannot come from the hardware.
          #
          # Pulp's sanctioned wrapper, tools/ci/governed-build.sh, acquires a
          # tartci lease and releases on exit -- but it lives in the PULP repo
          # and this job checks out only Spectr, so it is not reachable here.
          # A derived `cores / N` bound is not a substitute either: Pulp's own
          # governor documents its Tier-0 fallback as "NOT a saturation bound",
          # because on a big-RAM host the memory axis never binds and it
          # degrades to the full core count. So this is a literal share.
          #
          # tools/scripts/build_parallelism_guard.py deliberately does not scan
          # .github/workflows/** -- a workflow's `runs-on` resolves dynamically
          # and a static scan cannot tell an ephemeral runner from a shared
          # Studio. Bounding a self-hosted leg is therefore the workflow
          # author's job, and this is that. tools/ci/test_product_acceptance_contract.py
          # asserts the bound so it cannot drift back.
          cmake --build "$SPECTR_BUILD_DIR" --parallel 4 --target \
            Spectr_Standalone Spectr_AU Spectr_VST3 Spectr_CLAP \
            Spectr-test Spectr-native-n1-test Spectr-editor-authority-test \
            Spectr-artifact-test Spectr-native-standalone-artifact-test \
            Spectr-native-shot

      # MUST run after the build: catch_discover_tests registers Catch2 cases
      # in a POST_BUILD step, so before the build the ctest list holds only the
      # statically-registered tests and almost every pattern reports zero --
      # which is indistinguishable from a genuinely rotted pattern.
      - name: Gate - every acceptance test pattern matches a test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/ctest_pattern_gate.py \
            --build-dir "$SPECTR_BUILD_DIR" \
            --patterns tools/ci/acceptance-ctest-patterns.txt
          regex="$(python3 tools/ci/ctest_pattern_gate.py \
            --build-dir "$SPECTR_BUILD_DIR" \
            --patterns tools/ci/acceptance-ctest-patterns.txt --emit-regex)"
          echo "SPECTR_ACCEPTANCE_CTEST_REGEX=$regex" >> "$GITHUB_ENV"

      - name: Gate - Spectr M5 product acceptance focused behavior
        shell: bash
        env:
          PULP_DISABLE_PLUGIN_EDITOR: "1"
          PULP_HEADLESS: "1"
          PULP_TEST_MODE: "1"
        run: |
          set -euo pipefail
          ctest --test-dir "$SPECTR_BUILD_DIR" --output-on-failure --no-tests=error \
            -R "$SPECTR_ACCEPTANCE_CTEST_REGEX"
          env CI=0 PULP_DISABLE_PLUGIN_EDITOR=0 PULP_HEADLESS=0 PULP_TEST_MODE=0 \
            ctest --test-dir "$SPECTR_BUILD_DIR" --output-on-failure --no-tests=error \
              -R '^Pulp host loads'

      - name: Gate - Spectr M5 product acceptance native editor capture
        shell: bash
        env:
          PULP_DISABLE_PLUGIN_EDITOR: "1"
          PULP_HEADLESS: "1"
          PULP_TEST_MODE: "1"
        run: |
          set -euo pipefail
          # This host has real GPU capture, so Spectr-native-shot must actually
          # run and capture the shipping native editor -- a SKIP here (exit 77,
          # CTest "Not Run") means the gate stopped proving anything about that
          # surface, and a SKIP is never a PASS.
          #
          # The #8094 tolerance this step used to carry is gone. That blocker
          # (Settings body flex_basis regression in the SDK: the MODULATION
          # group ended up outside every ScrollView) does NOT fire on the
          # pinned SDK -- the test captures and passes. tools/native_shot.cpp
          # still carries the exact-message branch, so the skip remains
          # REACHABLE if the regression comes back; but now that the surface is
          # measurable, a skip is a regression to act on, not a state to
          # tolerate. The message match survives only to name the cause in the
          # failure.
          NATIVE_SHOT_LOG="$SPECTR_ACCEPTANCE_ROOT/native-shot-output.log"
          ctest --test-dir "$SPECTR_BUILD_DIR" --output-on-failure --no-tests=error \
            -R '^Spectr-native-shot$' --output-junit "$SPECTR_ACCEPTANCE_ROOT/native-shot-junit.xml" \
            --verbose | tee "$NATIVE_SHOT_LOG"
          if grep -q '<skipped' "$SPECTR_ACCEPTANCE_ROOT/native-shot-junit.xml"; then
            if grep -q 'SKIP: native MODULATION capture blocked by tracked Pulp SDK issue #8094' "$NATIVE_SHOT_LOG"; then
              echo "Spectr-native-shot SKIPPED for Pulp SDK issue #8094 (Settings body flex_basis regression). That blocker does not fire on the pinned SDK, so this is a REGRESSION in the SDK pin or in the Settings layout -- not a tolerated state. The native editor surface is unmeasured." >&2
            else
              echo "Spectr-native-shot SKIPPED on a host expected to have GPU capture -- the native editor surface is unmeasured, which is not a pass" >&2
            fi
            exit 1
          fi

      - name: Gate - no collapsed box on the captured native surface
        shell: bash
        run: |
          set -euo pipefail
          # The captures the step above just produced are the shipping native
          # editor. A collapsed Settings body is the SET-1/SET-2 defect, and no
          # other check sweeps for one: the appearance detectors adjudicate
          # only runs that DO paint, and reachability_census's population is
          # hit-test leaves, which a collapsed container is not. A pixel diff
          # cannot see it either -- a region that paints nothing renders as
          # plausible background.
          # bash 3.2 on macOS has no `mapfile`, so the dump list is built the
          # portable way.
          shots="$SPECTR_BUILD_DIR/spectr-native-shots"
          dumps="$SPECTR_ACCEPTANCE_ROOT/collapsed-box-dumps.txt"
          find "$shots" -name '*.layout.json' -print | sort > "$dumps"
          n=$(wc -l < "$dumps" | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "no verdict: $shots holds no layout dump, so this gate would report about a surface it never measured" >&2
            exit 1
          fi
          echo "sweeping $n captured surface(s) for a collapsed box"
          rc=0
          while IFS= read -r dump; do
            set +e
            python3 tools/spectr-detectors/collapsed_box.py "$dump" --quiet
            one=$?
            set -e
            # 1 is a finding; 2 is UNMEASURED (no depth sidecar) and is never a
            # pass, so both fail the gate rather than being folded into green.
            if [ "$one" -ne 0 ]; then rc=1; fi
          done < "$dumps"
          exit $rc

      - name: Gate - every control reaches the area it paints
        shell: bash
        env:
          PULP_DISABLE_PLUGIN_EDITOR: "1"
          PULP_HEADLESS: "1"
          PULP_TEST_MODE: "1"
        run: |
          set -euo pipefail
          # The detector self-test above proves hit_target_reach.py can both
          # pass and fail, but it reads COMMITTED fixtures -- it says nothing
          # about the build in this job. This runs the same rule against dumps
          # taken from THIS binary, which is what makes it a regression gate
          # rather than a test of the detector.
          #
          # SPECTR_HIT_PROBE opens Settings, expands both LFO disclosures (the
          # densest the panel ever gets) and writes two dumps. A press on the
          # toggle KNOB used to resolve to the knob, which carries its own click
          # handler, so the bubble walk stopped there and 40% of every switch
          # was dead; and a hover-grown slider thumb sat 9px outside the only
          # rect that could be pressed.
          shots="$SPECTR_ACCEPTANCE_ROOT/hit-target-shots"
          mkdir -p "$shots"
          SPECTR_HIT_PROBE=1 "$SPECTR_BUILD_DIR/Spectr-native-shot" \
            --out="$shots" --backend=skia --scale=1 \
            > "$SPECTR_ACCEPTANCE_ROOT/hit-target-probe.log" 2>&1 || {
              echo "SPECTR_HIT_PROBE run failed; the surface is unmeasured" >&2
              tail -40 "$SPECTR_ACCEPTANCE_ROOT/hit-target-probe.log" >&2
              exit 1
            }
          rc=0
          found=0
          for dump in "$shots/hit-transport.layout.json" \
                      "$shots/hit-settings-modulation.layout.json"; do
            if [ ! -f "$dump" ]; then
              echo "no verdict: $dump was not written" >&2
              rc=1
              continue
            fi
            found=$((found + 1))
            set +e
            python3 tools/spectr-detectors/hit_target_reach.py "$dump"
            one=$?
            set -e
            # 1 is a finding; 2 and 3 are UNMEASURED and are never a pass.
            if [ "$one" -ne 0 ]; then rc=1; fi
          done
          # A sweep over zero dumps is not a clean sweep.
          if [ "$found" -eq 0 ]; then
            echo "no verdict: the probe wrote no dump to sweep" >&2
            exit 1
          fi
          exit $rc

      - name: Gate - a named control is REACHED by a press at the rect it paints
        shell: bash
        env:
          PULP_DISABLE_PLUGIN_EDITOR: "1"
          PULP_HEADLESS: "1"
          PULP_TEST_MODE: "1"
        run: |
          set -euo pipefail
          # The gate above compares a control's own hit rect against its own
          # painted rect, which can only see a defect a control commits against
          # ITSELF. This one runs the real View::hit_test at the painted centre
          # and asks what came back, which is the only way to see the defect an
          # ANCESTOR commits: the help guide's close X shipped as a correctly
          # sized, correctly wired 32x32 button inside a wrapper whose box had
          # collapsed to 0x0, and every gate in this repo was green. Rect
          # containment is half-open, so that wrapper admitted no point at all;
          # the guide was dismissable only through hit_test's ~500px overflow
          # slack, measured from an in-flow position on the other side of the
          # window.
          shots="$SPECTR_ACCEPTANCE_ROOT/press-reach-shots"
          mkdir -p "$shots"
          SPECTR_PRESS_REACH=1 "$SPECTR_BUILD_DIR/Spectr-native-shot" \
            --out="$shots" --backend=skia --scale=1 \
            > "$SPECTR_ACCEPTANCE_ROOT/press-reach-probe.log" 2>&1 || {
              echo "SPECTR_PRESS_REACH run failed; press reach is unmeasured" >&2
              tail -40 "$SPECTR_ACCEPTANCE_ROOT/press-reach-probe.log" >&2
              exit 1
            }
          # The probe's own trial of the close X, which is a press and a
          # negative press rather than a rect comparison. A missing VERDICT
          # line means the trial never ran, which is not a pass.
          if ! grep -q "VERDICT close-X-by-press: PASS" \
                 "$SPECTR_ACCEPTANCE_ROOT/press-reach-probe.log"; then
            echo "no verdict: the close-X press trial did not report PASS" >&2
            grep -E "^\[guide\]" "$SPECTR_ACCEPTANCE_ROOT/press-reach-probe.log" >&2 || true
            exit 1
          fi
          dump="$shots/required.press-reach.json"
          if [ ! -f "$dump" ]; then
            echo "no verdict: $dump was not written" >&2
            exit 1
          fi
          set +e
          python3 tools/spectr-detectors/press_target_reach.py "$dump"
          rc=$?
          set -e
          # 1 is a finding; 2 and 3 are UNMEASURED and are never a pass.
          exit $rc

      - name: Gate - the morph track is laid out clear of its A/B labels
        shell: bash
        run: |
          set -euo pipefail
          # The SAME transport dump the hit-target step above just captured
          # from THIS binary, so this is a regression gate on the build rather
          # than a test of the detector (the self-test already proves the
          # detector can both pass and fail, from committed fixtures).
          #
          # The rule is about the TRACK, not the thumb, and that is the whole
          # point: for most of this control's life the 90px track was laid out
          # at the flanking "A" label's own x -- the labels were bare inline
          # spans with no layout box -- so a thumb perfectly contained in its
          # track still painted over the label at value 0. box_intersection
          # cannot see that pair at all, because it compares only nodes that
          # carry TEXT and the thumb is a text-free div.
          #
          # The morph slider is DISABLED in every state the probe reaches, so
          # the thumb here is opacity 0 -- which does not weaken the gate: the
          # defect is the track's x, and that is state-independent.
          dump="$SPECTR_ACCEPTANCE_ROOT/hit-target-shots/hit-transport.layout.json"
          if [ ! -f "$dump" ]; then
            echo "no verdict: $dump was not written, so the morph row is unmeasured" >&2
            exit 1
          fi
          set +e
          python3 tools/spectr-detectors/morph_row_clearance.py "$dump"
          rc=$?
          set -e
          # 1 is a finding; 2 is UNMEASURED (wrong surface / no sidecar) and is
          # never folded into green.
          if [ "$rc" -ne 0 ]; then exit 1; fi
          # Negative control against the same live dump: a detector that cannot
          # redden here is not guarding this build, whatever it printed above.
          if python3 tools/spectr-detectors/morph_row_clearance.py "$dump" \
               --plant overlap > /dev/null 2>&1; then
            echo "the planted overlap did not redden the detector on THIS dump -- "\
                 "its clean run above proves nothing" >&2
            exit 1
          fi

      # REPORTING ONLY (continue-on-error). These four drive the built
      # standalone headlessly, so unlike the fixture lane above they need the
      # app and cost minutes, and each can legitimately return "no verdict"
      # (exit 2) when the surface it probes does not materialise in a headless
      # capture. An exit 2 is UNMEASURED, never a pass -- which is exactly why
      # they report here instead of blocking. Promote one to a gate only once
      # it has produced a stable 0/1 verdict across several runs on this host.
      - name: Report - app-driven detectors (non-blocking)
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          PULP_DISABLE_PLUGIN_EDITOR: "1"
          PULP_HEADLESS: "1"
          PULP_TEST_MODE: "1"
        run: |
          app="$SPECTR_BUILD_DIR/Spectr.app/Contents/MacOS/Spectr"
          out="$SPECTR_ACCEPTANCE_ROOT/detectors"
          mkdir -p "$out"
          if [[ ! -x "$app" ]]; then
            echo "no verdict: $app is not executable -- every detector below "\
                 "would report about a build that does not exist" >&2
            exit 1
          fi
          rc_summary=""
          run_one() {
            local name="$1"; shift
            set +e
            "$@" > "$out/$name.txt" 2>&1
            local rc=$?
            set -e
            case "$rc" in
              0) verdict="PASS" ;;
              1) verdict="FAIL" ;;
              *) verdict="UNMEASURED(exit $rc) -- not a pass" ;;
            esac
            echo "  $name: $verdict"
            rc_summary="$rc_summary$name=$rc "
            tail -5 "$out/$name.txt" | sed 's/^/      | /'
          }
          run_one settings-scroll-track python3 tools/spectr-detectors/settings_scroll_track_on_edge.py \
            --app "$app" --out-dir "$out/scroll-track"
          run_one preset-caption-single-line python3 tools/spectr-detectors/preset_caption_single_line.py \
            --app "$app" --out-dir "$out/preset-caption"
          run_one hover-leave-persistence python3 tools/spectr-detectors/hover_leave_persistence.py \
            --app "$app" --out-dir "$out/hover-leave"
          run_one menu-item-caption-uniformity python3 tools/spectr-detectors/menu_item_caption_uniformity.py "$app"
          run_one status-pill-width python3 tools/spectr-detectors/status_pill_width_invariance.py \
            --app "$app" --out-dir "$out/status-pill"
          run_one status-pill-position python3 tools/spectr-detectors/status_pill_position_invariance.py \
            --app "$app" --out-dir "$out/status-pill-position"
          run_one shortcut-chip-trailing-edge python3 tools/spectr-detectors/shortcut_chip_trailing_edge.py "$app"
          run_one edit-mode-shortcut-keys python3 tools/spectr-detectors/edit_mode_shortcut_keys.py "$app"
          run_one preset-commit-gestures python3 tools/spectr-detectors/preset_commit_gestures_app.py "$app"
          echo "::notice::app-driven detector verdicts: $rc_summary"

      - name: Gate - Spectr M5 product acceptance AUv2 validation
        shell: bash
        run: |
          set -euo pipefail
          au_src="$SPECTR_BUILD_DIR/AU/Spectr.component"
          au_dst="$HOME/Library/Audio/Plug-Ins/Components/Spectr.component"
          [[ -d "$au_src" ]]
          mkdir -p "$(dirname "$au_dst")"
          rm -rf "$au_dst"
          ditto "$au_src" "$au_dst"
          # A clean Tart guest still has a process-global Audio Component
          # registry. Force discovery of the component copied above, then
          # require two stable validations after the rescan settles.
          killall -KILL AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          : > "$SPECTR_ACCEPTANCE_ROOT/auval.txt"
          for attempt in 1 2; do
            attempt_log="$SPECTR_ACCEPTANCE_ROOT/auval-$attempt.txt"
            PULP_DISABLE_PLUGIN_EDITOR=1 PULP_HEADLESS=1 PULP_TEST_MODE=1 \
              auval -v aufx Spec Pulp \
                | tee "$attempt_log"
            grep -q 'AU VALIDATION SUCCEEDED' "$attempt_log"
            cat "$attempt_log" >> "$SPECTR_ACCEPTANCE_ROOT/auval.txt"
          done

      - name: Gate - Spectr M5 product acceptance testable PKG
        shell: bash
        run: |
          set -euo pipefail
          stage="$SPECTR_ACCEPTANCE_ROOT/pkg-root"
          mkdir -p "$stage/Applications" \
            "$stage/Library/Audio/Plug-Ins/Components" \
            "$stage/Library/Audio/Plug-Ins/VST3" \
            "$stage/Library/Audio/Plug-Ins/CLAP"
          ditto "$SPECTR_BUILD_DIR/Spectr.app" "$stage/Applications/Spectr.app"
          ditto "$SPECTR_BUILD_DIR/AU/Spectr.component" "$stage/Library/Audio/Plug-Ins/Components/Spectr.component"
          ditto "$SPECTR_BUILD_DIR/VST3/Spectr.vst3" "$stage/Library/Audio/Plug-Ins/VST3/Spectr.vst3"
          ditto "$SPECTR_BUILD_DIR/CLAP/Spectr.clap" "$stage/Library/Audio/Plug-Ins/CLAP/Spectr.clap"
          pkg="$SPECTR_ACCEPTANCE_ROOT/Spectr-M5-Product-Acceptance-${GITHUB_SHA:0:12}.pkg"
          pkgbuild --root "$stage" --identifier com.pulp.spectr.acceptance \
            --version 1.0.0 --install-location / "$pkg"
          pkgutil --payload-files "$pkg" | sort > "$SPECTR_ACCEPTANCE_ROOT/pkg-payload.txt"
          grep -qE '^(\./)?Applications/Spectr\.app/' "$SPECTR_ACCEPTANCE_ROOT/pkg-payload.txt"
          grep -qE '^(\./)?Library/Audio/Plug-Ins/Components/Spectr\.component/' "$SPECTR_ACCEPTANCE_ROOT/pkg-payload.txt"
          grep -qE '^(\./)?Library/Audio/Plug-Ins/VST3/Spectr\.vst3/' "$SPECTR_ACCEPTANCE_ROOT/pkg-payload.txt"
          grep -qE '^(\./)?Library/Audio/Plug-Ins/CLAP/Spectr\.clap/' "$SPECTR_ACCEPTANCE_ROOT/pkg-payload.txt"
          echo "SPECTR_ACCEPTANCE_PKG=$pkg" >> "$GITHUB_ENV"

      - name: Publish exact-head M5-testable product-acceptance PKG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Spectr-M5-Product-Acceptance-${{ github.sha }}
          path: |
            ${{ env.SPECTR_ACCEPTANCE_PKG }}
            ${{ env.SPECTR_ACCEPTANCE_ROOT }}/auval.txt
            ${{ env.SPECTR_ACCEPTANCE_ROOT }}/pkg-payload.txt
          if-no-files-found: error
          retention-days: 14
