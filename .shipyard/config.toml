# Shipyard dispatch configuration for Spectr.
# The cloud backend is only workflow_dispatch transport. The workflow accepts
# no selector override and admits only Shipyard's local transient Tart pool.
[project]
name = "spectr"
type = "cmake"
platforms = ["macos"]

[targets.mac]
backend = "cloud"
platform = "macos-arm64"
workflow = "m5-product-acceptance.yml"
repository = "danielraffel/spectr"
# `timeout_secs` is NOT read by the cloud backend -- `resolved_cloud()` resolves
# its ceiling from `cloud_max_poll_secs` -> `max_poll_secs` -> `cloud.max_poll_secs`
# and otherwise defaults to 3600s, so this key alone silently capped a gate the
# workflow allows 120 minutes at half that. It stays for the day the backend
# reads it; `max_poll_secs` is the one that actually takes effect today.
timeout_secs = 7200
max_poll_secs = 7200

[cloud]
# Capacity is selected by the workflow's literal self-hosted labels. This
# provider names Shipyard's GitHub Actions dispatch adapter, not runner capacity.
provider = "github-hosted"
default_workflow = "m5-product-acceptance"
repository = "danielraffel/spectr"

[merge]
require_platforms = ["macos"]

# What must arrive before this repository's PRs are allowed to merge, and which
# workflow produces it. Shipyard's landability preflight reads branch
# protection first and falls back to these.
#
# `main` IS protected now, with this exact context required. That was blocked
# until the gate could always report: a required check whose workflow is
# skipped by a path filter stays *Pending forever*, and
# `m5-product-acceptance.yml` used to carry a `paths-ignore` -- measured, PR #94
# was docs-only and produced zero check runs. The fix was to drop that filter
# and short-circuit inside the job, NOT to add a companion workflow posting the
# same name: two producers of one check name is the same failure wearing a
# different hat. The gate now always runs, always reports, and a docs-only PR
# costs a checkout instead of a build.
#
# The string below must match the JOB name in that workflow exactly -- it is
# `Spectr M5 product-acceptance gate` (lowercase "product-acceptance gate"),
# which is NOT the workflow's display name `Spectr M5 Product Acceptance`. Get
# it wrong and every PR blocks forever on a status nothing will ever post.
[governance]
required_status_checks = ["Spectr M5 product-acceptance gate"]

[landability]
workflows = [".github/workflows/m5-product-acceptance.yml"]

[ship]
base_branch = "main"
